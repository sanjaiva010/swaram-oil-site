<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Swaram — My Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    cream: '#F6F1E2', creamtwo: '#EFE7D2', ink: '#211C13',
    olive: '#37402A', olivedark: '#262D1B', gold: '#C6963C',
    goldlight: '#E7C978', rust: '#A6552A', card: '#FCFAF3'
  }}}}
</script>
</head>
<body class="bg-cream text-ink min-h-screen flex flex-col">

<header class="bg-cream/90 border-b border-ink/10">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3">
      <img src="images/logo.png" alt="Swaram logo" class="w-11 h-11 rounded-full object-cover shadow-md">
      <div class="leading-tight">
        <div class="font-display text-lg tracking-wide">SWARAM</div>
        <div class="text-[10px] tracking-[0.2em] text-ink/50 -mt-1">COLD PRESSED · TIRUPUR</div>
      </div>
    </a>
    <button id="logoutBtn" class="text-sm font-medium text-ink/70 hover:text-rust">Log out</button>
  </div>
</header>

<main class="flex-1 max-w-3xl mx-auto w-full px-6 py-14">
  <div id="loadingState" class="text-center py-20 text-ink/50">Loading your account…</div>

  <div id="signedOutState" class="hidden text-center py-20">
    <p class="text-ink/50 mb-6">You're not signed in.</p>
    <a href="login.html" class="bg-olive text-cream px-7 py-3.5 rounded-full font-medium inline-block hover:bg-olivedark">Go to login</a>
  </div>

  <div id="signedInState" class="hidden">
    <p class="text-rust font-semibold tracking-[0.2em] text-xs mb-2">MY ACCOUNT</p>
    <h1 id="userEmail" class="font-display text-3xl mb-10"></h1>

    <h2 class="font-display text-xl mb-4">Order history</h2>
    <div id="ordersList" class="space-y-4"></div>
    <p id="noOrders" class="hidden text-ink/50 text-sm">No orders yet — head to the shop to place your first one.</p>
  </div>
</main>

<footer class="text-xs text-ink/40 text-center py-6">© 2026 Swaram Agro Products.</footer>

<script>
  async function init() {
    const user = await getCurrentUser();
    document.getElementById('loadingState').classList.add('hidden');

    if (!user) {
      document.getElementById('signedOutState').classList.remove('hidden');
      return;
    }

    document.getElementById('signedInState').classList.remove('hidden');
    document.getElementById('userEmail').textContent = user.email || 'Welcome back';

    // Fetch this user's past orders (RLS ensures they only see their own)
    const { data: orders, error } = await supabaseClient
      .from('orders')
      .select('id, status, total, created_at, order_items(oil_name, size, qty, price)')
      .order('created_at', { ascending: false });

    const list = document.getElementById('ordersList');
    if (error || !orders || orders.length === 0) {
      document.getElementById('noOrders').classList.remove('hidden');
      return;
    }

    orders.forEach(order => {
      const card = document.createElement('div');
      card.className = 'bg-card border border-ink/10 rounded-2xl p-5';
      const itemsHtml = order.order_items.map(i => `${i.qty} × ${i.oil_name} (${i.size})`).join(', ');
      card.innerHTML = `
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-medium capitalize">${order.status}</span>
          <span class="text-sm text-ink/50">${new Date(order.created_at).toLocaleDateString()}</span>
        </div>
        <div class="text-sm text-ink/70 mb-2">${itemsHtml}</div>
        <div class="font-semibold">₹ ${order.total}</div>
      `;
      list.appendChild(card);
    });
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  });

  init();
</script>

</body>
</html>
